  input.gym:focus { outline:none; border-color:#555; }
  @keyframes slideDown { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

<script type="text/jsx-manual" id="app-source">
const { useState, useEffect, useRef } = React;

// Plan content (days, dailyLayer, principles, weekMap, branding) now lives in plan-template.js
// as window.DEFAULT_PLAN, loaded via <script> above so index.html has zero hardcoded content.
function todayKey() { return new Date().toISOString().slice(0, 10); }

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

  firebase.initializeApp(firebaseConfig);

function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Boxing bell = inharmonic partials with sharp attack + long decay
    const partials = [
      { freq: 620,  gain: 1.0,  decay: 3.0 },
      { freq: 1240, gain: 0.55, decay: 2.2 },
      { freq: 1860, gain: 0.35, decay: 1.6 },
      { freq: 2600, gain: 0.20, decay: 1.1 },
      { freq: 890,  gain: 0.45, decay: 2.4 },
      { freq: 1580, gain: 0.25, decay: 1.8 },
    ];
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.7, ctx.currentTime);
    master.connect(ctx.destination);
    partials.forEach(({ freq, gain, decay }) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 0.002);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + decay);
      osc.connect(g); g.connect(master);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + decay);
    });
  } catch(e) {}
}

function RestTimer({ seconds, color, onClose, onGo }) {
  const [left, setLeft] = useState(seconds);
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => {
      const next = left - 1;
      if (next === 0) playBell();
      setLeft(next);
    }, 1000);
    return () => clearTimeout(t);
  }, [left]);
  const done = left <= 0;
  return (
    <div style={{ position: "fixed", bottom: 16, left: "50%", transform: "translateX(-50%)", zIndex: 50,
      background: done ? "#00E87A" : "#161616", color: done ? "#000" : "#fff",
      border: "1px solid " + (done ? "#00E87A" : color), borderRadius: 30, padding: "10px 18px",
      display: "flex", alignItems: "center", gap: 14, boxShadow: "0 6px 24px rgba(0,0,0,0.5)", minWidth: 200, justifyContent: "space-between" }}>
      <span onClick={done ? onGo : undefined}
        style={{ fontSize: 12, letterSpacing: 1, cursor: done ? "pointer" : "default", flex: 1 }}>
        {done ? "✓ REST DONE — GO ▶" : "REST"}
      </span>
      {!done && <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, color }}>{Math.floor(left/60)}:{String(left%60).padStart(2,"0")}</span>}
      <button onClick={onClose} style={{ background: "transparent", border: "none", color: done ? "#000" : "#888", fontSize: 16, cursor: "pointer" }}>✕</button>
    </div>
  );
}

function itemSets(item) {
  if (typeof item.sets === "number") return item.sets;
  return item.detail && item.detail.startsWith("2×") ? 2 : 3;
}
function itemRest(item) {
  if (typeof item.restSeconds === "number") return item.restSeconds;
  const m = item.detail && item.detail.match(/(\d+)s rest/);
  return m ? parseInt(m[1]) : 60;
}
function isStrengthSection(sec) {
  if (typeof sec.isStrength === "boolean") return sec.isStrength;
  return sec.name.includes("STRENGTH") || sec.name.includes("CIRCUIT");
}

function WorkoutApp({ username, plan, onSignOut }) {
  const days = plan.days;
  const weekMap = plan.weekMap || [];
  const dailyLayer = plan.dailyLayer || [];
  const coachZPrinciples = plan.principles || [];
  const branding = plan.branding || {};
  const CZ = branding.accentColor || "#B388FF";
  const nsKey = (k) => k + "__" + username;

  const [activeDay, setActiveDay] = useState((days[0] && days[0].id) || "mon");
  const [expandedEx, setExpandedEx] = useState(null);
  const [view, setView] = useState("workouts");

  const [log, setLog] = useState(() => loadLS(nsKey("cz_log"), {}));
  const [exMode, setExMode] = useState(() => loadLS(nsKey("cz_exmode"), {}));
  const [timer, setTimer] = useState(null);
  const [nextTarget, setNextTarget] = useState(null);
  const [expandedSets, setExpandedSets] = useState({});
  const [sectionsDone, setSectionsDone] = useState(() => loadLS(nsKey("cz_sections"), {}));
  const [expandedSecs, setExpandedSecs] = useState({});
  const [daily, setDaily] = useState(() => loadLS(nsKey("cz_daily"), {}));

  const [syncStatus, setSyncStatus] = useState(syncDb ? "connecting" : "unavailable");
  const applyingRemoteRef = useRef(false);
  const hasSyncedOnceRef = useRef(false);
  const unsubRef = useRef(null);

  const day = days.find((d) => d.id === activeDay) || days[0];
  const dk = todayKey();
  const syncCode = username + "-" + dk; // per-user, rotates automatically at midnight
  const totalBurn = weekMap.reduce((s, d) => s + d.burn, 0);
  const maxBurn = weekMap.length ? Math.max.apply(null, weekMap.map((d) => d.burn)) : 1;

  useEffect(() => { saveLS(nsKey("cz_log"), log); }, [log]);
  useEffect(() => { saveLS(nsKey("cz_exmode"), exMode); }, [exMode]);
  useEffect(() => { saveLS(nsKey("cz_daily"), daily); }, [daily]);
  useEffect(() => { saveLS(nsKey("cz_sections"), sectionsDone); }, [sectionsDone]);

  // Subscribe to today's cloud doc. Re-runs automatically when the date (and so syncCode) rolls over.
  useEffect(() => {
    if (!syncDb) return;
    let cancelled = false;
    hasSyncedOnceRef.current = false;
    setSyncStatus("connecting");
    syncAuthReady.then(() => {
      if (cancelled) return;
      const ref = syncDb.collection("gymAppSync").doc(syncCode);
      unsubRef.current = ref.onSnapshot((snap) => {
        const data = snap.data();
        if (data) {
          applyingRemoteRef.current = true;
          if (data.cz_log) setLog(data.cz_log);
          if (data.cz_daily) setDaily(data.cz_daily);
          if (data.cz_sections) setSectionsDone(data.cz_sections);
          if (data.cz_exmode) setExMode(data.cz_exmode);
        } else if (!hasSyncedOnceRef.current) {
          // First device to open the app today — seed today's doc from this device's full local history.
          ref.set({ cz_log: log, cz_daily: daily, cz_sections: sectionsDone, cz_exmode: exMode, updatedAt: Date.now() });
        }
        hasSyncedOnceRef.current = true;
        setSyncStatus("synced");
      }, (err) => { console.error(err); setSyncStatus("error"); });
    });
    return () => { cancelled = true; if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; } };
  }, [syncCode]);

  // Push local changes to today's cloud doc (debounced), skipping writes that just came from the cloud.
  useEffect(() => {
    if (!syncDb || !hasSyncedOnceRef.current) return;
    if (applyingRemoteRef.current) { applyingRemoteRef.current = false; return; }
    const t = setTimeout(() => {
      syncAuthReady.then(() => {
        syncDb.collection("gymAppSync").doc(syncCode).set({
          cz_log: log, cz_daily: daily, cz_sections: sectionsDone, cz_exmode: exMode, updatedAt: Date.now(),
        }).catch((e) => { console.error(e); setSyncStatus("error"); });
      });
    }, 800);
    return () => clearTimeout(t);
  }, [log, daily, sectionsDone, exMode, syncCode]);

  const dayLog = log[dk] || {};
  const today = daily[dk] || { bw: "", protein: "", water: "", sleep: "", steps: "", checks: {} };

  function updateSet(exId, setIdx, field, val, totalSets) {
    setLog((prev) => {
      const d = Object.assign({}, prev[dk] || {});
      const ex = d[exId] ? { sets: prev[dk][exId].sets.slice() } : { sets: Array.from({ length: totalSets }, () => ({ w: "", r: "", done: false })) };
      ex.sets[setIdx] = Object.assign({}, ex.sets[setIdx], { [field]: val });
      d[exId] = ex;
      return Object.assign({}, prev, { [dk]: d });
    });
  }
  function toggleMode(exId) { setExMode((p) => Object.assign({}, p, { [exId]: p[exId] === "check" ? "full" : "check" })); }
  function setDailyField(field, val) { setDaily((prev) => Object.assign({}, prev, { [dk]: Object.assign({ checks: {} }, prev[dk] || {}, { [field]: val }) })); }
  function markAllDone(exId, nSets, isDone) {
    setLog((prev) => {
      const d = Object.assign({}, prev[dk] || {});
      const sets = Array.from({ length: nSets }, (_, i) => Object.assign({}, (d[exId] && d[exId].sets[i]) || { w: "", r: "" }, { done: !isDone }));
      d[exId] = { sets };
      return Object.assign({}, prev, { [dk]: d });
    });
  }
  function toggleCheck(name) {
    setDaily((prev) => {
      const t = prev[dk] || { checks: {} };
      const checks = Object.assign({}, t.checks, { [name]: !(t.checks && t.checks[name]) });
      return Object.assign({}, prev, { [dk]: Object.assign({}, t, { checks }) });
    });
  }

  const strengthOrder = [];
  day.sections.forEach((sec) => {
    if (isStrengthSection(sec)) {
      sec.items.forEach((item, ii) => {
        const exId = day.id + "-" + sec.name.slice(0,4) + "-" + ii;
        strengthOrder.push({ exId, nSets: itemSets(item) });
      });
    }
  });

  function getNextTarget(exId, setIdx, nSets) {
    if (setIdx + 1 < nSets) return { exId, setIdx: setIdx + 1 };
    const idx = strengthOrder.findIndex((x) => x.exId === exId);
    if (idx >= 0 && idx + 1 < strengthOrder.length) return { exId: strengthOrder[idx + 1].exId, setIdx: 0 };
    return null;
  }

  const secKey = (si) => dk + "-" + activeDay + "-sec-" + si;
  const firstIncompleteSec = day.sections.findIndex((_, si) => !sectionsDone[secKey(si)]);

  function resetDay() {
    setSectionsDone((p) => {
      const n = Object.assign({}, p);
      day.sections.forEach((_, si) => { delete n[secKey(si)]; });
      return n;
    });
    setExpandedEx(null);
    setExpandedSecs({});
    setNextTarget(null);
    setTimer(null);
  }

  const firstIncompleteExId = strengthOrder.find(({ exId, nSets }) => {
    const e = (log[dk] || {})[exId];
    return !(e && e.sets.length === nSets && e.sets.every((s) => s.done));
  })?.exId;

  const bwHistory = Object.keys(daily)
    .filter((k) => daily[k].bw && !isNaN(parseFloat(daily[k].bw)))
    .sort()
    .map((date) => ({ date, bw: parseFloat(daily[date].bw) }));
  const last7 = bwHistory.slice(-7);
  const bw7avg = last7.length ? (last7.reduce((s, x) => s + x.bw, 0) / last7.length).toFixed(1) : null;

  const dailyChecks = ["10,000 steps", "170g protein", "3L water", "7–8h sleep", "Workout done", "Posing/vacuum"];

  return (
    <div style={{ fontFamily: "'DM Mono', 'Courier New', monospace", background: "#0A0A0A", minHeight: "100vh", color: "#E8E8E0", paddingBottom: 80 }}>
      {timer && <RestTimer seconds={timer} color={day.color} onClose={() => { setTimer(null); setNextTarget(null); }} onGo={() => {
        setTimer(null);
        if (nextTarget) {
          const el = document.getElementById("set-" + nextTarget.exId + "-" + nextTarget.setIdx);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }} />}

      <div style={{ background: "#111", borderBottom: "1px solid #222", padding: "22px 24px 16px" }}>
        <div style={{ maxWidth: 700, margin: "0 auto" }}>
          <div style={{ fontSize: 10, letterSpacing: 4, color: "#555", marginBottom: 6 }}>{branding.gymLabel || "TRAINING APP"}</div>
          <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 32, letterSpacing: 3, lineHeight: 1, color: "#fff" }}>
            {branding.title || "TRAINING APP"} <span style={{ color: CZ }}>🅩</span>
          </h1>
          <div style={{ fontSize: 10, color: "#555", marginTop: 6, letterSpacing: 1.5 }}>
            {branding.statsLine ? branding.statsLine + " · " : ""}{new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 12, paddingTop: 12, borderTop: "1px solid #1E1E1E" }}>
            <span style={{ fontSize: 9, letterSpacing: 1.5, color: "#555", display: "flex", alignItems: "center", gap: 4 }}>
              SYNC
              {syncStatus === "synced" && <span style={{ color: "#00E87A" }} title="Live — today's data syncs automatically across your devices">●</span>}
              {syncStatus === "connecting" && <span style={{ color: "#FFB800" }} title="Connecting…">●</span>}
              {syncStatus === "error" && <span style={{ color: "#FF6B6B" }} title="Sync error — check console">●</span>}
              {syncStatus === "unavailable" && <span style={{ color: "#444" }} title="Cloud sync not configured">✕</span>}
            </span>
            {syncDb && <span style={{ fontSize: 9, color: "#444" }}>· auto, no code needed</span>}
            <span style={{ flex: 1 }} />
            <span style={{ fontSize: 9, letterSpacing: 1.5, color: "#666" }}>{username}</span>
            <button onClick={onSignOut}
              style={{ fontSize: 9, letterSpacing: 1, padding: "5px 10px", borderRadius: 5, border: "1px solid #333",
                background: "transparent", color: "#666", cursor: "pointer", fontFamily: "'DM Mono',monospace" }}>
              SWITCH USER
            </button>
          </div>
        </div>
      </div>

      <div style={{ background: "#0D0D0D", padding: "10px 24px", borderBottom: "1px solid #1A1A1A", position: "sticky", top: 0, zIndex: 20 }}>
        <div style={{ maxWidth: 700, margin: "0 auto", display: "flex", gap: 6 }}>
          {[["workouts", "💪 TRAIN"], ["daily", "📊 DAILY"], ["system", "🔥 BURN MAP"]]
            .concat(branding.showMethodTab !== false && coachZPrinciples.length ? [["coachz", "🅩 METHOD"]] : [])
            .map(([v, lbl]) => (
            <button key={v} className="view-btn" onClick={() => setView(v)}
              style={{ flex: 1, padding: "13px 4px", borderRadius: 6, fontSize: 9, letterSpacing: 1,
                background: view === v ? (v === "coachz" ? CZ : "#E8E8E0") : "#1A1A1A",
                color: view === v ? "#000" : "#666", fontWeight: 500 }}>{lbl}</button>
          ))}
        </div>
      </div>

      {view === "workouts" && (
        <React.Fragment>
          <div style={{ background: "#0F0F0F", borderBottom: "1px solid #1A1A1A", padding: "12px 24px" }}>
            <div style={{ maxWidth: 700, margin: "0 auto", display: "flex", gap: 8 }}>
              {days.map((d) => (
                <button key={d.id} className="day-btn" onClick={() => { setActiveDay(d.id); setExpandedEx(null); }}
                  style={{ flex: 1, padding: "14px 4px", background: activeDay === d.id ? d.color : "#1A1A1A",
                    color: activeDay === d.id ? "#000" : "#666", borderRadius: 6, fontSize: 10, fontWeight: 500, letterSpacing: 1.5 }}>
                  <div style={{ fontSize: 18, marginBottom: 4 }}>{d.icon}</div>{d.label}
                </button>
              ))}
            </div>
          </div>

          <div style={{ maxWidth: 700, margin: "0 auto", padding: "20px 20px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
              <div>
                <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 30, letterSpacing: 2, color: day.color, lineHeight: 1 }}>{day.title}</h2>
                <div style={{ fontSize: 10, color: "#555", letterSpacing: 1.5, marginTop: 4 }}>{day.subtitle} · {day.cardioType}</div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 9, letterSpacing: 2, color: "#444" }}>EST. SESSION BURN</div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, color: day.color }}>{day.burn}</div>
                </div>
                <button onClick={resetDay}
                  style={{ fontSize: 9, letterSpacing: 1.5, padding: "8px 14px", borderRadius: 6, border: "1px solid #333",
                    background: "transparent", color: "#555", cursor: "pointer", fontFamily: "'DM Mono',monospace" }}>
                  ↺ RESET DAY
                </button>
              </div>
            </div>

            {day.sections.map((sec, si) => {
              const isStrength = isStrengthSection(sec);
              const sk = secKey(si);
              const secDone = !!sectionsDone[sk];
              const isCurrentSec = si === firstIncompleteSec;
              const secOpen = secDone ? !!expandedSecs[sk] : (isCurrentSec || !!expandedSecs[sk]);

              return (
                <div key={si} className="sec-card" style={{ marginBottom: 12, background: "#111", borderRadius: 8, overflow: "hidden",
                  border: secDone ? "1px solid #00E87A44" : isCurrentSec ? "1px solid " + day.color + "55" : "1px solid #1E1E1E" }}>
                  <div className="ex-row" onClick={() => setExpandedSecs((p) => Object.assign({}, p, { [sk]: !p[sk] }))}
                    style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px",
                      background: secDone ? "#00E87A0D" : isCurrentSec ? day.color + "15" : "#161616",
                      borderBottom: secOpen ? "1px solid #1E1E1E" : "none" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
                      <button onClick={(e) => { e.stopPropagation();
                          setSectionsDone((p) => Object.assign({}, p, { [sk]: !p[sk] }));
                          if (!secDone) setExpandedSecs((p) => Object.assign({}, p, { [sk]: false }));
                        }}
                        style={{ width: 36, height: 36, borderRadius: "50%", border: "2px solid " + (secDone ? "#00E87A" : isCurrentSec ? day.color : "#444"),
                          background: secDone ? "#00E87A" : "transparent", color: secDone ? "#000" : (isCurrentSec ? day.color : "#555"),
                          fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✓</button>
                      <div style={{ fontSize: 10, letterSpacing: 3, fontWeight: 500, color: secDone ? "#00E87A" : isCurrentSec ? day.color : "#CCC",
                        textDecoration: secDone ? "line-through" : "none", opacity: secDone ? 0.7 : 1 }}>{sec.name}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                      {sec.badge && !secDone && <div style={{ fontSize: 9, padding: "3px 8px", background: day.color + "22", color: day.color, borderRadius: 3, letterSpacing: 1 }}>{sec.badge}</div>}
                      {secDone && <span style={{ fontSize: 9, letterSpacing: 1.5, background: "#00E87A", color: "#000", padding: "2px 7px", borderRadius: 10, fontWeight: 600 }}>✓ DONE</span>}
                      <div style={{ fontSize: 11, color: "#555" }}>{secOpen ? "▲" : "▼"}</div>
                    </div>
                  </div>
                  {secOpen && sec.note && <div style={{ padding: "8px 14px", background: "#0D0D0D", borderBottom: "1px solid #1A1A1A", fontSize: 10, color: "#777", lineHeight: 1.6 }}>{sec.note}</div>}
                  {secOpen && <div>
                    {sec.items.map((item, ii) => {
                      const key = si + "-" + ii;
                      const exId = day.id + "-" + sec.name.slice(0,4) + "-" + ii;
                      const isOpen = expandedEx === key;
                      const hasTip = item.tip || item.avoid || item.coachZ;
                      const nSets = itemSets(item);
                      const mode = exMode[exId] || "full";
                      const exLog = dayLog[exId];
                      const rest = itemRest(item);
                      const allDone = isStrength && exLog && exLog.sets.length === nSets && exLog.sets.every((s) => s.done);
                      const isCurrent = isStrength && !allDone && exId === firstIncompleteExId;
                      const setsOpen = !allDone && isCurrent;

                      return (
                        <div key={ii} style={{ borderBottom: ii < sec.items.length - 1 ? "1px solid #181818" : "none" }}>
                          <div className={hasTip ? "ex-row" : ""} onClick={hasTip && !allDone ? () => setExpandedEx(isOpen ? null : key) : undefined}
                            style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "14px 14px", gap: 12,
                              background: allDone ? "#00E87A08" : isCurrent ? day.color + "0D" : "transparent",
                              borderLeft: allDone ? "3px solid #00E87A" : isCurrent ? "3px solid " + day.color : "3px solid transparent" }}>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                                <span style={{ fontSize: 12, color: allDone ? "#00E87A" : isOpen || isCurrent ? day.color : "#DDD", fontWeight: allDone || isOpen || isCurrent ? 500 : 400,
                                  textDecoration: allDone ? "line-through" : "none", opacity: allDone ? 0.7 : 1 }}>
                                  {item.label}
                                </span>
                                {item.coachZ && !allDone && <span style={{ color: CZ, fontSize: 11 }}>🅩</span>}
                                {allDone && <span style={{ fontSize: 9, letterSpacing: 1.5, background: "#00E87A", color: "#000", padding: "2px 7px", borderRadius: 10, fontWeight: 600 }}>✓ DONE</span>}
                              </div>
                              {item.detail && !allDone && <div style={{ fontSize: 10, color: "#555", marginTop: 3, lineHeight: 1.5 }}>{item.detail}</div>}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 18, flexShrink: 0 }}>
                              {hasTip && !allDone && <div style={{ fontSize: 18, color: isOpen ? day.color : "#444", flexShrink: 0, padding: "4px 6px" }}>{isOpen ? "▲" : "▼"}</div>}
                              {isStrength && (
                                <button onClick={(e) => { e.stopPropagation(); markAllDone(exId, nSets, allDone); }}
                                  style={{ width: 36, height: 36, borderRadius: "50%", border: "2px solid " + (allDone ? "#00E87A" : "#444"), background: allDone ? "#00E87A" : "transparent",
                                    color: allDone ? "#000" : "#666", fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                  ✓
                                </button>
                              )}
                            </div>
                          </div>

                          {isStrength && setsOpen && (
                            <div style={{ padding: "0 14px 12px" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                                <button onClick={() => toggleMode(exId)}
                                  style={{ background: "#1A1A1A", border: "1px solid #2A2A2A", color: "#888", fontSize: 9, letterSpacing: 1,
                                    padding: "4px 8px", borderRadius: 4, cursor: "pointer", fontFamily: "'DM Mono',monospace" }}>
                                  {mode === "full" ? "◉ WEIGHT+REPS · tap for quick" : "◉ QUICK CHECK · tap for full"}
                                </button>
                                <button onClick={() => setTimer(rest)}
                                  style={{ background: day.color + "1A", border: "1px solid " + day.color + "55", color: day.color, fontSize: 9, letterSpacing: 1,
                                    padding: "4px 10px", borderRadius: 4, cursor: "pointer", fontFamily: "'DM Mono',monospace" }}>
                                  ⏱ REST {rest}s
                                </button>
                              </div>

                              {mode === "full" ? (
                                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                  {Array.from({ length: nSets }).map((_, sIdx) => {
                                    const s = (exLog && exLog.sets[sIdx]) || { w: "", r: "", done: false };
                                    const isNext = nextTarget && nextTarget.exId === exId && nextTarget.setIdx === sIdx;
                                    return (
                                      <div key={sIdx} id={"set-" + exId + "-" + sIdx}
                                        style={{ display: "flex", alignItems: "center", gap: 8, borderRadius: 6, padding: "2px 0",
                                          transition: "box-shadow 0.3s",
                                          boxShadow: isNext ? "0 0 0 2px " + day.color : "none",
                                          animation: isNext ? "nextPulse 1.2s ease-in-out infinite" : "none" }}>
                                        <span style={{ fontSize: 10, color: isNext ? day.color : "#555", width: 28, fontWeight: isNext ? 600 : 400 }}>S{sIdx + 1}</span>
                                        <input className="gym" inputMode="decimal" placeholder="lbs" value={s.w}
                                          onChange={(e) => updateSet(exId, sIdx, "w", e.target.value, nSets)} style={{ flex: 1 }} />
                                        <span style={{ color: "#444" }}>×</span>
                                        <input className="gym" inputMode="numeric" placeholder="reps" value={s.r}
                                          onChange={(e) => updateSet(exId, sIdx, "r", e.target.value, nSets)} style={{ flex: 1 }} />
                                        <button onClick={() => { updateSet(exId, sIdx, "done", !s.done, nSets); if (!s.done) { setTimer(rest); setNextTarget(getNextTarget(exId, sIdx, nSets)); } else { setNextTarget(null); } }}
                                          style={{ width: 44, height: 44, borderRadius: 8, border: "none", cursor: "pointer", flexShrink: 0,
                                            background: s.done ? "#00E87A" : "#1A1A1A", color: s.done ? "#000" : "#555", fontSize: 18 }}>✓</button>
                                      </div>
                                    );
                                  })}
                                </div>
                              ) : (
                                <div style={{ display: "flex", gap: 8 }}>
                                  {Array.from({ length: nSets }).map((_, sIdx) => {
                                    const s = (exLog && exLog.sets[sIdx]) || { done: false };
                                    const isNext = nextTarget && nextTarget.exId === exId && nextTarget.setIdx === sIdx;
                                    return (
                                      <button key={sIdx} id={"set-" + exId + "-" + sIdx}
                                        onClick={() => { updateSet(exId, sIdx, "done", !s.done, nSets); if (!s.done) { setTimer(rest); setNextTarget(getNextTarget(exId, sIdx, nSets)); } else { setNextTarget(null); } }}
                                        style={{ flex: 1, padding: "16px 10px", borderRadius: 8, border: isNext ? "2px solid " + day.color : "none", cursor: "pointer",
                                          background: s.done ? "#00E87A" : "#1A1A1A", color: s.done ? "#000" : (isNext ? day.color : "#666"), fontSize: 11, letterSpacing: 1,
                                          animation: isNext ? "nextPulse 1.2s ease-in-out infinite" : "none" }}>
                                        SET {sIdx + 1} {s.done ? "✓" : (isNext ? "▶" : "")}
                                      </button>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          )}

                          {isOpen && hasTip && !allDone && (
                            <div className="tip-box" style={{ padding: "0 14px 12px", background: day.color + "08" }}>
                              {item.tip && (<div style={{ marginBottom: (item.coachZ || item.avoid) ? 8 : 0 }}>
                                <div style={{ fontSize: 9, letterSpacing: 2, color: day.color, marginBottom: 4 }}>✓ TECHNIQUE</div>
                                <div style={{ fontSize: 11, color: "#AAA", lineHeight: 1.7 }}>{item.tip}</div></div>)}
                              {item.coachZ && (<div style={{ marginBottom: item.avoid ? 8 : 0, padding: "8px 10px", background: CZ + "10", borderLeft: "2px solid " + CZ, borderRadius: 3 }}>
                                <div style={{ fontSize: 9, letterSpacing: 2, color: CZ, marginBottom: 4 }}>🅩 COACH Z</div>
                                <div style={{ fontSize: 11, color: "#BBB", lineHeight: 1.7 }}>{item.coachZ}</div></div>)}
                              {item.avoid && (<div>
                                <div style={{ fontSize: 9, letterSpacing: 2, color: "#FF6B6B", marginBottom: 4 }}>✗ AVOID</div>
                                <div style={{ fontSize: 11, color: "#888", lineHeight: 1.7 }}>{item.avoid}</div></div>)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>}
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}

      {view === "daily" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "22px 20px 0" }}>
          <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, letterSpacing: 2, color: "#fff", marginBottom: 4 }}>TODAY'S NUMBERS</h2>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
            <div style={{ fontSize: 10, color: "#666" }}>Auto-saved on this device. Log daily for the trend line.</div>
            <button onClick={() => {
                const data = {};
                ["cz_log","cz_daily","cz_sections","cz_exmode"].forEach(k => {
                  const v = localStorage.getItem(nsKey(k));
                  if (v) data[k] = JSON.parse(v);
                });
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = username + "-data-" + new Date().toISOString().slice(0,10) + ".json";
                a.click();
                URL.revokeObjectURL(a.href);
              }}
              style={{ fontSize: 9, letterSpacing: 1.5, padding: "8px 14px", borderRadius: 6, border: "1px solid #333",
                background: "transparent", color: "#888", cursor: "pointer", fontFamily: "'DM Mono',monospace", flexShrink: 0 }}>
              ↓ EXPORT
            </button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 18 }}>
            {[
              { f: "bw", label: "BODYWEIGHT (kg)", ph: "80.0", mode: "decimal" },
              { f: "waist", label: "WAIST (cm) · <90 target", ph: "92", mode: "decimal" },
              { f: "protein", label: "PROTEIN (g) · 170 target", ph: "170", mode: "numeric" },
              { f: "water", label: "WATER (L) · 3 target", ph: "3.0", mode: "decimal" },
              { f: "sleep", label: "SLEEP (h) · 7–8 target", ph: "7.5", mode: "decimal" },
              { f: "steps", label: "STEPS · 10,000 target", ph: "10000", mode: "numeric" },
            ].map((x) => (
              <div key={x.f}>
                <div style={{ fontSize: 9, letterSpacing: 2, color: "#555", marginBottom: 5 }}>{x.label}</div>
                <input className="gym" inputMode={x.mode} placeholder={x.ph} value={today[x.f] || ""} onChange={(e) => setDailyField(x.f, e.target.value)} />
              </div>
            ))}
          </div>

          <div style={{ fontSize: 9, letterSpacing: 3, color: "#444", marginBottom: 10 }}>24-HOUR CHECKLIST</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 22 }}>
            {dailyChecks.map((c) => {
              const on = today.checks && today.checks[c];
              return (
                <button key={c} onClick={() => toggleCheck(c)}
                  style={{ display: "flex", alignItems: "center", gap: 8, padding: "11px 12px", borderRadius: 7, cursor: "pointer", textAlign: "left",
                    border: "1px solid " + (on ? "#00E87A55" : "#222"), background: on ? "#00E87A12" : "#111",
                    color: on ? "#00E87A" : "#888", fontSize: 11, fontFamily: "'DM Mono',monospace" }}>
                  <span style={{ width: 18, height: 18, borderRadius: 4, flexShrink: 0, background: on ? "#00E87A" : "#1A1A1A",
                    color: "#000", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>{on ? "✓" : ""}</span>
                  {c}
                </button>
              );
            })}
          </div>

          <div style={{ fontSize: 9, letterSpacing: 3, color: "#444", marginBottom: 4 }}>BODYWEIGHT TREND</div>
          {bw7avg ? (
            <div style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "16px", marginBottom: 22 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
                <div>
                  <div style={{ fontSize: 9, letterSpacing: 2, color: "#555" }}>7-DAY AVERAGE</div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 34, color: "#00E87A", lineHeight: 1 }}>{bw7avg}<span style={{ fontSize: 14, color: "#555" }}> kg</span></div>
                </div>
                <div style={{ fontSize: 10, color: "#666", textAlign: "right" }}>{bwHistory.length} entries logged<br />{last7.length} in last 7</div>
              </div>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 50 }}>
                {last7.map((p, i) => {
                  const vals = last7.map((x) => x.bw);
                  const min = Math.min.apply(null, vals) - 0.3, max = Math.max.apply(null, vals) + 0.3;
                  const h = max === min ? 50 : ((p.bw - min) / (max - min)) * 46 + 4;
                  return <div key={i} title={p.date + ": " + p.bw + "kg"} style={{ flex: 1, height: h, background: "#00E87A55", borderTop: "2px solid #00E87A", borderRadius: 2 }} />;
                })}
              </div>
            </div>
          ) : (
            <div style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "16px", marginBottom: 22, fontSize: 11, color: "#666", lineHeight: 1.6 }}>
              Log your bodyweight a few days running and your 7-day trend appears here. Same time daily, after bathroom, before food.
            </div>
          )}
        </div>
      )}

      {view === "system" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 20px 0" }}>
          <div style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 10, letterSpacing: 4, color: "#444", marginBottom: 4 }}>WEEKLY BURN MAP</div>
            <div style={{ fontSize: 10, color: "#666", marginBottom: 16, lineHeight: 1.6 }}>
              Total: <span style={{ color: "#E8E8E0" }}>~{totalBurn.toLocaleString()} kcal/week</span> from training + walks, before the food deficit.
            </div>
            {weekMap.map((d, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                <div style={{ width: 36, fontSize: 10, color: d.color === "#444" ? "#555" : d.color, letterSpacing: 1, flexShrink: 0 }}>{d.day}</div>
                <div style={{ flex: 1, height: 22, background: "#141414", borderRadius: 4, overflow: "hidden" }}>
                  <div className="burn-bar" style={{ width: ((d.burn / maxBurn) * 100) + "%", height: "100%",
                    background: d.color === "#444" ? "#2A2A2A" : d.color + "55", borderRight: "2px solid " + (d.color === "#444" ? "#555" : d.color),
                    display: "flex", alignItems: "center", paddingLeft: 8 }}>
                    <span style={{ fontSize: 9, color: "#CCC", whiteSpace: "nowrap" }}>{d.focus}</span>
                  </div>
                </div>
                <div style={{ width: 44, fontSize: 11, color: "#999", textAlign: "right", flexShrink: 0 }}>{d.burn}</div>
              </div>
            ))}
          </div>

          <div style={{ fontSize: 10, letterSpacing: 4, color: "#444", marginBottom: 4 }}>THE 24-HOUR LAYER</div>
          <div style={{ fontSize: 10, color: "#666", marginBottom: 16, lineHeight: 1.6 }}>The gym is 75 minutes. Fat loss is decided in the other 22.75 hours.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 28 }}>
            {dailyLayer.map((p, i) => (
              <div key={i} style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "14px" }}>
                <div style={{ fontSize: 16, marginBottom: 6 }}>{p.icon}</div>
                <div style={{ fontSize: 11, fontWeight: 500, color: "#CCC", marginBottom: 6 }}>{p.title}</div>
                <div style={{ fontSize: 10, color: "#666", lineHeight: 1.65 }}>{p.body}</div>
              </div>
            ))}
          </div>

          <div style={{ background: "#111", border: "1px solid #222", borderRadius: 8, padding: "16px", display: "flex", gap: 24, flexWrap: "wrap" }}>
            {[
              { label: "WEEKLY TRAINING BURN", val: "~" + totalBurn.toLocaleString() + " kcal" },
              { label: "PHASE 1 INTAKE", val: "1,800 kcal/day" },
              { label: "FOOD DEFICIT", val: "~850 kcal/day" },
              { label: "PROJECTED LOSS", val: "0.7–0.8 kg/wk" },
              { label: "PROTEIN", val: "170g/day" },
              { label: "STEPS", val: "10,000–12,000/day" },
              { label: "WAIST TARGET", val: "under 90 cm" },
            ].map((stat, i) => (
              <div key={i}>
                <div style={{ fontSize: 9, letterSpacing: 3, color: "#444", marginBottom: 4 }}>{stat.label}</div>
                <div style={{ fontSize: 13, color: "#CCC" }}>{stat.val}</div>

      {view === "coachz" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 20px 0" }}>
          <div style={{ marginBottom: 20 }}>
            <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 2, color: CZ, lineHeight: 1 }}>THE COACH Z METHOD</h2>
            <div style={{ fontSize: 10, color: "#666", marginTop: 8, lineHeight: 1.7 }}>
              Ziad Mansour's aesthetic methodology, woven into every strength exercise (look for the 🅩 tag). The fat-loss structure burns the fat; these cues decide what the physique looks like when it's revealed.
            </div>
          </div>
          {coachZPrinciples.map((p, i) => (
            <div key={i} style={{ display: "flex", gap: 14, background: "#111", border: "1px solid #1E1E1E", borderLeft: "3px solid " + CZ, borderRadius: 8, padding: "14px 16px", marginBottom: 10 }}>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, color: CZ + "66", flexShrink: 0, lineHeight: 1 }}>{p.num}</div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: "#DDD", marginBottom: 4 }}>{p.title}</div>
                <div style={{ fontSize: 10, color: "#777", lineHeight: 1.7 }}>{p.body}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function migrateLegacyData(username) {
  const flagKey = "cz_migrated__" + username;
  if (localStorage.getItem(flagKey)) return;
  ["cz_log", "cz_daily", "cz_sections", "cz_exmode"].forEach((k) => {
    const legacy = localStorage.getItem(k);
    if (legacy && !localStorage.getItem(k + "__" + username)) {
      localStorage.setItem(k + "__" + username, legacy);
    }
  });
  localStorage.setItem(flagKey, "1");
}

function UsernameGate({ onLogin }) {
  const [value, setValue] = useState("");
  const [status, setStatus] = useState("idle"); // idle | checking | error
  const [errorMsg, setErrorMsg] = useState("");

  function submit() {
    const name = value.trim();
    if (!name) return;
    const slug = window.slugifyUsername(name);
    if (!slug) { setStatus("error"); setErrorMsg("Enter a valid username."); return; }
    if (!syncDb) { setStatus("error"); setErrorMsg("Cloud sync not configured — can't verify users."); return; }
    setStatus("checking");
    syncAuthReady.then(() => syncDb.collection("users").doc(slug).get())
      .then((snap) => {
        if (!snap.exists) { setStatus("error"); setErrorMsg("No such user — ask your coach to create one."); return; }
        const data = snap.data();
        onLogin(data.username || name, data.plan || window.DEFAULT_PLAN);
      })
      .catch((e) => { console.error(e); setStatus("error"); setErrorMsg("Couldn't reach the server — try again."); });
  }

  return (
    <div style={{ fontFamily: "'DM Mono', 'Courier New', monospace", background: "#0A0A0A", minHeight: "100vh", color: "#E8E8E0",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ maxWidth: 340, width: "100%" }}>
        <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 30, letterSpacing: 2, color: "#fff", marginBottom: 6, textAlign: "center" }}>WHO'S TRAINING?</h1>
        <div style={{ fontSize: 11, color: "#666", marginBottom: 20, textAlign: "center", lineHeight: 1.6 }}>Enter your username to load your plan and progress.</div>
        <input className="gym" placeholder="username" value={value}
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          style={{ marginBottom: 12, fontSize: 15, padding: "12px 10px" }} autoFocus />
        <button onClick={submit} disabled={status === "checking"}
          style={{ width: "100%", padding: "13px", borderRadius: 6, border: "none", cursor: status === "checking" ? "default" : "pointer",
            background: "#E8E8E0", color: "#000", fontSize: 12, letterSpacing: 1.5, fontWeight: 600, fontFamily: "'DM Mono',monospace" }}>
          {status === "checking" ? "CHECKING…" : "CONTINUE ▶"}
        </button>
        {status === "error" && <div style={{ marginTop: 12, fontSize: 11, color: "#FF6B6B", textAlign: "center" }}>{errorMsg}</div>}
      </div>
    </div>
  );
}

function App() {
  const [username, setUsername] = useState(() => loadLS("cz_user", null));
  const [plan, setPlan] = useState(() => loadLS("cz_user_plan", null));

  // Refresh the cached plan from the cloud on load, so admin edits reach an already-logged-in user.
  useEffect(() => {
    if (!username || !syncDb) return;
    const slug = window.slugifyUsername(username);
    syncAuthReady.then(() => syncDb.collection("users").doc(slug).get())
      .then((snap) => {
        if (snap.exists) {
          const data = snap.data();
          if (data.plan) { saveLS("cz_user_plan", data.plan); setPlan(data.plan); }
        }
      })
      .catch((e) => console.error(e));
  }, [username]);

  function handleLogin(name, userPlan) {
    migrateLegacyData(name);
    saveLS("cz_user", name);
    saveLS("cz_user_plan", userPlan);
    setUsername(name);
    setPlan(userPlan);
  }
  function handleSignOut() {
    localStorage.removeItem("cz_user");
    localStorage.removeItem("cz_user_plan");
    setUsername(null);
    setPlan(null);
  }

  if (!username || !plan) return <UsernameGate onLogin={handleLogin} />;
  return <WorkoutApp key={username} username={username} plan={plan} onSignOut={handleSignOut} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
