function strengthItems(day) {
  const out = [];
  day.sections.forEach((sec) => {
    if (sec.name.includes("STRENGTH") || sec.name.includes("CIRCUIT")) {
      sec.items.forEach((it, idx) => {
        const sets = it.detail && it.detail.startsWith("2×") ? 2 : 3;
        out.push({ id: day.id + "-" + sec.name.slice(0,4) + "-" + idx, label: it.label, sets });
      });
    }
  });
  return out;
}
function todayKey() { return new Date().toISOString().slice(0, 10); }

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

function RestTimer({ seconds, color, onClose }) {
  const [left, setLeft] = useState(seconds);
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => setLeft(left - 1), 1000);
    return () => clearTimeout(t);
  }, [left]);
  const done = left <= 0;
  return (
    <div style={{ position: "fixed", bottom: 16, left: "50%", transform: "translateX(-50%)", zIndex: 50,
      background: done ? "#00E87A" : "#161616", color: done ? "#000" : "#fff",
      border: "1px solid " + (done ? "#00E87A" : color), borderRadius: 30, padding: "10px 18px",
      display: "flex", alignItems: "center", gap: 14, boxShadow: "0 6px 24px rgba(0,0,0,0.5)", minWidth: 200, justifyContent: "space-between" }}>
      <span style={{ fontSize: 12, letterSpacing: 1 }}>{done ? "✓ REST DONE — GO" : "REST"}</span>
      {!done && <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, color }}>{Math.floor(left/60)}:{String(left%60).padStart(2,"0")}</span>}
      <button onClick={onClose} style={{ background: "transparent", border: "none", color: done ? "#000" : "#888", fontSize: 16, cursor: "pointer" }}>✕</button>
    </div>
  );
}

          <div style={{ fontSize: 9, letterSpacing: 3, color: "#444", marginBottom: 4 }}>BODYWEIGHT TREND</div>
          {bw7avg ? (
            <div style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "16px", marginBottom: 22 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
                <div>
                  <div style={{ fontSize: 9, letterSpacing: 2, color: "#555" }}>7-DAY AVERAGE</div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 34, color: "#00E87A", lineHeight: 1 }}>{bw7avg}<span style={{ fontSize: 14, color: "#555" }}> kg</span></div>
                </div>
                <div style={{ fontSize: 10, color: "#666", textAlign: "right" }}>{bwHistory.length} entries logged<br />{last7.length} in last 7</div>
              </div>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 50 }}>
                {last7.map((p, i) => {
                  const vals = last7.map((x) => x.bw);
                  const min = Math.min.apply(null, vals) - 0.3, max = Math.max.apply(null, vals) + 0.3;
                  const h = max === min ? 50 : ((p.bw - min) / (max - min)) * 46 + 4;
                  return <div key={i} title={p.date + ": " + p.bw + "kg"} style={{ flex: 1, height: h, background: "#00E87A55", borderTop: "2px solid #00E87A", borderRadius: 2 }} />;
                })}
              </div>
            </div>
          ) : (
            <div style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "16px", marginBottom: 22, fontSize: 11, color: "#666", lineHeight: 1.6 }}>
              Log your bodyweight a few days running and your 7-day trend appears here. Same time daily, after bathroom, before food.
            </div>
          )}
        </div>
      )}

      {view === "system" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 20px 0" }}>
          <div style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 10, letterSpacing: 4, color: "#444", marginBottom: 4 }}>WEEKLY BURN MAP</div>
            <div style={{ fontSize: 10, color: "#666", marginBottom: 16, lineHeight: 1.6 }}>
              Total: <span style={{ color: "#E8E8E0" }}>~{totalBurn.toLocaleString()} kcal/week</span> from training + walks, before the food deficit.
            </div>
            {weekMap.map((d, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                <div style={{ width: 36, fontSize: 10, color: d.color === "#444" ? "#555" : d.color, letterSpacing: 1, flexShrink: 0 }}>{d.day}</div>
                <div style={{ flex: 1, height: 22, background: "#141414", borderRadius: 4, overflow: "hidden" }}>
                  <div className="burn-bar" style={{ width: ((d.burn / maxBurn) * 100) + "%", height: "100%",
                    background: d.color === "#444" ? "#2A2A2A" : d.color + "55", borderRight: "2px solid " + (d.color === "#444" ? "#555" : d.color),
                    display: "flex", alignItems: "center", paddingLeft: 8 }}>
                    <span style={{ fontSize: 9, color: "#CCC", whiteSpace: "nowrap" }}>{d.focus}</span>
                  </div>
                </div>
                <div style={{ width: 44, fontSize: 11, color: "#999", textAlign: "right", flexShrink: 0 }}>{d.burn}</div>
              </div>
            ))}
          </div>

          <div style={{ fontSize: 10, letterSpacing: 4, color: "#444", marginBottom: 4 }}>THE 24-HOUR LAYER</div>
          <div style={{ fontSize: 10, color: "#666", marginBottom: 16, lineHeight: 1.6 }}>The gym is 75 minutes. Fat loss is decided in the other 22.75 hours.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 28 }}>
            {dailyLayer.map((p, i) => (
              <div key={i} style={{ background: "#111", border: "1px solid #1E1E1E", borderRadius: 8, padding: "14px" }}>
                <div style={{ fontSize: 16, marginBottom: 6 }}>{p.icon}</div>
                <div style={{ fontSize: 11, fontWeight: 500, color: "#CCC", marginBottom: 6 }}>{p.title}</div>
                <div style={{ fontSize: 10, color: "#666", lineHeight: 1.65 }}>{p.body}</div>
              </div>
            ))}
          </div>

          <div style={{ background: "#111", border: "1px solid #222", borderRadius: 8, padding: "16px", display: "flex", gap: 24, flexWrap: "wrap" }}>
            {[
              { label: "WEEKLY TRAINING BURN", val: "~" + totalBurn.toLocaleString() + " kcal" },
              { label: "FOOD DEFICIT", val: "400–500 kcal/day" },
              { label: "PROJECTED LOSS", val: "0.5–0.7 kg/wk" },
              { label: "PROTEIN", val: "140–150g/day" },
              { label: "STEPS", val: "10,000/day" },
            ].map((stat, i) => (
              <div key={i}>
                <div style={{ fontSize: 9, letterSpacing: 3, color: "#444", marginBottom: 4 }}>{stat.label}</div>
                <div style={{ fontSize: 13, color: "#CCC" }}>{stat.val}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {view === "coachz" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 20px 0" }}>
          <div style={{ marginBottom: 20 }}>
            <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 2, color: CZ, lineHeight: 1 }}>THE COACH Z METHOD</h2>
            <div style={{ fontSize: 10, color: "#666", marginTop: 8, lineHeight: 1.7 }}>
              Ziad Mansour's aesthetic methodology, woven into every strength exercise (look for the 🅩 tag). The fat-loss structure burns the fat; these cues decide what the physique looks like when it's revealed.
            </div>
          </div>
          {coachZPrinciples.map((p, i) => (
            <div key={i} style={{ display: "flex", gap: 14, background: "#111", border: "1px solid #1E1E1E", borderLeft: "3px solid " + CZ, borderRadius: 8, padding: "14px 16px", marginBottom: 10 }}>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, color: CZ + "66", flexShrink: 0, lineHeight: 1 }}>{p.num}</div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: "#DDD", marginBottom: 4 }}>{p.title}</div>
                <div style={{ fontSize: 10, color: "#777", lineHeight: 1.7 }}>{p.body}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkoutApp />);
</script>
</body>
</html>
